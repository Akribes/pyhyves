site_name: Pyhyves
repo_url: https://github.com/Akribes/pyhyves
edit_uri: blob/main/docs/

theme:
    name: material
    palette:
        scheme: slate
    language: nl

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      toc_depth: 3

plugins:
- mkdocstrings:
    default_handler: python
    handlers:
        python:
            inventories:
                - https://docs.python.org/3/objects.inv
            options:
                docstring_options:
                    ignore_init_summary: true
                docstring_section_style: table
                signature_crossrefs: true
                unwrap_annotated: true
                # Most constructors aren't meant to be used directly, so we leave them out of the docs.
                # The few classes that do need __init__ to be shown are overridden in api.md.
                filters:
                  - '!^_'
                  - '__\w+__$'
                  - '!^__init__$'
                inherited_members: true
                summary:
                    module: false
                    class: true
                    attributes: true
                parameter_headings: true
                type_parameter_headings: true
                show_root_heading: true
                show_root_full_path: false
                show_symbol_type_heading: true
                show_symbol_type_toc: true
                line_length: 88
                merge_init_into_class: false
                separate_signature: false
                show_attribute_values: false
                show_overloads: true
                show_signature_annotations: true
                show_signature_type_parameters: true
                show_bases: true
                show_inheritance_diagram: false
                members_order: source
                show_submodules: false
                show_source: false
                show_if_no_docstring: true
                # docs/api.md has its own `##` sections, so symbols sit one level below
                heading_level: 3
