[project]
name = "pyhyves"
version = "0.1.0"
description = "Python-client for Hyves"
authors = [
    {name = "Akribes"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "authlib (>=1.8.0,<2.0.0)",
    "httpx2[http2] (>=2.13.1,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "httpx2(*, assert_all_called=False, assert_all_mocked=False, base_url=...): configure the httpx2_mock fixture",
]

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    # respx (a pytest-httpx2 dependency) mocks httpx2 but validates its side effects
    # against the httpx v1 classes, which the tests therefore import directly
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-httpx2 (>=1.0.0,<2.0.0)",
]
docs = [
    "mkdocstrings-python (>=2.0.9,<3.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocs[i18n] (>=1.6.1,<2.0.0)"
]
